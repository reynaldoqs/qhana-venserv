# Genera los instaladores de la app de escritorio (Windows y Mac) y el APK del agente.
# Se ejecuta a mano (Actions → Instalador → Run workflow) o al subir una etiqueta v*.
# Los archivos quedan como "artifacts" de la ejecución (se descargan desde la página del run).
name: Instalador

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  apk:
    name: APK del agente
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
      - name: Pruebas del protocolo y compilación
        working-directory: agente-android
        run: ./gradlew :protocolo:test :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: agente-apk
          path: agente-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows:
    name: Instalador Windows
    needs: apk
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: agente-apk
          path: apk
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            control
            control/escritorio/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependencias de la app
        working-directory: control/escritorio
        run: npm ci
      - name: Juntar control, interfaz, recetas, APK y adb
        working-directory: control/escritorio
        shell: pwsh
        env:
          APK: ${{ github.workspace }}\apk\app-debug.apk
        run: .\scripts\preparar.ps1
      - name: Instalador (NSIS)
        working-directory: control/escritorio
        run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: qhana-windows
          path: control/escritorio/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  mac:
    name: Instalador Mac
    needs: apk
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: agente-apk
          path: apk
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            control
            control/escritorio/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependencias de la app
        working-directory: control/escritorio
        run: npm ci
      - name: Juntar control, interfaz, recetas, APK y adb
        working-directory: control/escritorio
        env:
          APK: ${{ github.workspace }}/apk/app-debug.apk
        run: scripts/preparar.sh
      - name: Instalador (dmg)
        working-directory: control/escritorio
        run: npx tauri build --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: qhana-mac
          path: control/escritorio/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
