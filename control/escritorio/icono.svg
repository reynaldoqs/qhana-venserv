<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262626"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="naranja" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ff8a47"/>
      <stop offset="1" stop-color="#e85002"/>
    </linearGradient>
    <radialGradient id="brillo" cx="0.5" cy="0.38" r="0.6">
      <stop offset="0" stop-color="#e85002" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e85002" stop-opacity="0"/>
    </radialGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- cuerpo con el margen que pide macOS -->
  <rect x="100" y="100" width="824" height="824" rx="188" fill="url(#fondo)"/>
  <rect x="100" y="100" width="824" height="824" rx="188" fill="url(#brillo)"/>
  <rect x="103" y="103" width="818" height="818" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="6"/>
  <!-- Q -->
  <g filter="url(#sombra)" fill="none" stroke="url(#naranja)" stroke-linecap="round">
    <circle cx="500" cy="488" r="228" stroke-width="92"/>
    <line x1="596" y1="584" x2="728" y2="716" stroke-width="92"/>
  </g>
  <!-- # de USSD -->
  <g stroke="#f9f9f9" stroke-width="30" stroke-linecap="round" opacity="0.95">
    <line x1="452" y1="414" x2="430" y2="562"/>
    <line x1="548" y1="414" x2="526" y2="562"/>
    <line x1="404" y1="458" x2="578" y2="458"/>
    <line x1="398" y1="520" x2="572" y2="520"/>
  </g>
</svg>
