nombre: entel-pda-recargar
titulo: Recargar saldo (Entel PDA)
operador: ENTEL
descripcion: Recarga de saldo a otro número desde un chip Entel PDA (dealer) con *133*número*monto#. El monto va en centavos con 3 dígitos (050 = Bs 0.50). Pide confirmación (1 Si / 2 No); el saldo de transferencia que queda se lee de la respuesta. MUEVE DINERO; solo en chips marcados pda.
modo: pantalla
accion: recargar
chip_tipo: pda
parametros:
  - { nombre: numero, patron: '^[67]\d{7}$' }
  # Centavos con 3 dígitos. Verificado el 2026-10-30: 050 → "Bs. 0.50". Agregar otros montos
  # (p. ej. "100" para Bs 1) solo después de probar cómo los muestra la confirmación.
  - { nombre: monto, opciones: ["050"] }
pasos:
  - marcar: "*133*{numero}*{monto}#"
    error_si: 'numero de dealer no existe'
    esperar: 'Esta seguro de recargar'
  - verificar: 'recargar Bs\.\s*[\d.]+ al telefono {numero}'
  - confirmar: 'Si'
    exito: 'Se ha transferido Bs\.\s*[\d.]+ a la linea {numero}'
salida:
  saldo_transferencia: 'saldo actual para transferencia es de Bs\.\s*([\d.,]+)'
  monto_bs: 'transferido Bs\.\s*([\d.]+)'
